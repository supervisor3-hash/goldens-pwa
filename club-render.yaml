services:
  - type: web
    name: goldens-club-digital
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/supervisor3-hash/goldens-pwa
    branch: goldens-club-v1
    buildCommand: pip install -r club_requirements.txt
    startCommand: gunicorn club_app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: CLUB_PRODUCTION
        value: "1"
      - key: CLUB_SECRET_KEY
        generateValue: true
      - key: CLUB_ADMIN_PASSWORD
        generateValue: true
      - key: GOLDENS_WHATSAPP_NUMBER
        value: "50660158371"
      - key: DATABASE_URL
        fromDatabase:
          name: goldens-club-db
          property: connectionString
