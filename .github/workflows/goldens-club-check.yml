name: Goldens Club checks
on:
  push:
    branches: [goldens-club-v1]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r club_requirements.txt
      - run: python -m py_compile club_app.py
      - run: python -m unittest test_club.py -v
